<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Learning Quiz</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --correct: #22c55e;
      --incorrect: #ef4444;
      --tile-bg: #334155;
      --tile-selected: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 12px;
    }

    .progress {
      font-weight: bold;
      color: var(--accent);
    }

    .score {
      font-weight: bold;
      color: var(--correct);
    }

    .question-box {
      text-align: center;
      margin: 10px 0;
    }

    .question-text {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .audio-btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.2rem;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s, background-color 0.2s;
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    .answer-slot {
      min-height: 60px;
      background-color: #0f172a;
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .tiles-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    .tile {
      background-color: var(--tile-bg);
      color: var(--text-main);
      padding: 12px 18px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
      border: 1px solid #475569;
    }

    .tile:hover {
      background-color: var(--tile-selected);
    }

    .tile:active {
      transform: scale(0.96);
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice-btn {
      background-color: var(--tile-bg);
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 16px;
      font-size: 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .choice-btn:hover {
      background-color: var(--tile-selected);
    }

    .choice-btn:active {
      transform: scale(0.98);
    }

    .action-btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .action-btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .feedback {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 24px;
    }

    .feedback.correct {
      color: var(--correct);
    }

    .feedback.incorrect {
      color: var(--incorrect);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div class="header">
      <div class="progress" id="progress">Question 1 / 30</div>
      <div class="score" id="score">Score: 0</div>
    </div>

    <div id="quiz-body">
      <div class="question-box">
        <div class="question-text" id="question-text">Prompt</div>
        <button class="audio-btn" id="play-audio-btn">🔊</button>
      </div>

      <div id="sentence-builder-mode">
        <div class="answer-slot" id="answer-slot"></div>
        <div class="tiles-area" id="tiles-area"></div>
      </div>

      <div id="choice-mode" class="choices-grid hidden"></div>

      <div class="feedback" id="feedback"></div>

      <button class="action-btn" id="submit-btn">Check Answer</button>
      <button class="action-btn hidden" id="next-btn">Next Question ➔</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
      <h2 style="font-size: 2rem; margin-bottom: 10px;">Quiz Completed!</h2>
      <p style="font-size: 1.3rem; margin-bottom: 20px;" id="final-score"></p>
      <button class="action-btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
  </div>

  <script>
    const vocabPool = ["ごはん", "みず", "おちゃ", "すし", "と", "です", "ください"];

    const rawQuestions = [
      { type: "build", prompt: "Rice and water, please!", target: ["ごはん", "と", "みず", "ください"], audio: "ごはんとみず、ください" },
      { type: "build", prompt: "Water and rice, please!", target: ["みず", "と", "ごはん", "ください"], audio: "みずとごはん、ください" },
      { type: "build", prompt: "It's green tea.", target: ["おちゃ", "です"], audio: "おちゃです" },
      { type: "build", prompt: "Sushi and green tea, please.", target: ["すし", "と", "おちゃ", "ください"], audio: "すしとおちゃ、ください" },
      { type: "build", prompt: "Green tea and sushi, please.", target: ["おちゃ", "と", "すし", "ください"], audio: "おちゃとすし、ください" },
      { type: "build", prompt: "Water and sushi, please.", target: ["みず", "と", "すし", "ください"], audio: "みずとすし、ください" },
      { type: "build", prompt: "Sushi and water, please.", target: ["すし", "と", "みず", "ください"], audio: "すしとみず、ください" },
      { type: "build", prompt: "It's rice.", target: ["ごはん", "です"], audio: "ごはんです" },
      { type: "build", prompt: "It's water.", target: ["みず", "です"], audio: "みずです" },
      { type: "build", prompt: "It's sushi.", target: ["すし", "です"], audio: "すしです" },
      { type: "build", prompt: "Rice, please!", target: ["ごはん", "ください"], audio: "ごはん、ください" },
      { type: "build", prompt: "Water, please!", target: ["みず", "ください"], audio: "みず、ください" },
      { type: "build", prompt: "Green tea, please!", target: ["おちゃ", "ください"], audio: "おちゃ、ください" },
      { type: "build", prompt: "Sushi, please!", target: ["すし", "ください"], audio: "すし、ください" },
      { type: "build", prompt: "Rice and green tea, please.", target: ["ごはん", "と", "おちゃ", "ください"], audio: "ごはんとおちゃ、ください" },
      { type: "build", prompt: "Green tea and rice, please.", target: ["おちゃ", "と", "ごはん", "ください"], audio: "おちゃとごはん、ください" },
      { type: "build", prompt: "Sushi and rice, please.", target: ["すし", "と", "ごはん", "ください"], audio: "すしとごはん、ください" },
      { type: "build", prompt: "Rice and sushi, please.", target: ["ごはん", "と", "すし", "ください"], audio: "ごはんとうし、ください" },
      { type: "build", prompt: "Listen and build the sentence", target: ["ごはん", "と", "みず", "ください"], audio: "ごはんとみず、ください" },
      { type: "build", prompt: "Listen and build the sentence", target: ["すし", "と", "おちゃ", "ください"], audio: "すしとおちゃ、ください" },

      { type: "choice", prompt: "How do you say 'Green tea'?", target: "おちゃ", choices: ["おちゃ", "みず", "ごはん", "すし"], audio: "おちゃ" },
      { type: "choice", prompt: "How do you say 'Water'?", target: "みず", choices: ["みず", "おちゃ", "ごはん", "すし"], audio: "みず" },
      { type: "choice", prompt: "How do you say 'Rice'?", target: "ごはん", choices: ["ごはん", "すし", "おちゃ", "みず"], audio: "ごはん" },
      { type: "choice", prompt: "How do you say 'Sushi'?", target: "すし", choices: ["すし", "ごはん", "みず", "おちゃ"], audio: "すし" },
      { type: "choice", prompt: "Listen and choose the word", target: "ください", choices: ["ください", "です", "と", "おちゃ"], audio: "ください" },
      { type: "choice", prompt: "Listen and choose the word", target: "です", choices: ["です", "ください", "と", "ごはん"], audio: "です" },
      { type: "choice", prompt: "How do you say 'and' in Japanese?", target: "と", choices: ["と", "です", "ください", "すし"], audio: "と" },
      { type: "choice", prompt: "Listen and choose the matching word", target: "みず", choices: ["mizu", "gohan", "ocha", "sushi"], audio: "みず" },
      { type: "choice", prompt: "Listen and choose the matching word", target: "ごはん", choices: ["gohan", "ocha", "sushi", "mizu"], audio: "ごはん" },
      { type: "choice", prompt: "Listen and choose the matching word", target: "すし", choices: ["sushi", "gohan", "mizu", "ocha"], audio: "すし" }
    ];

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let userSentence = [];
    let selectedChoice = null;

    function shuffleArray(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function initQuiz() {
      questions = shuffleArray([...rawQuestions]);
      currentIndex = 0;
      score = 0;
      document.getElementById("score").textContent = `Score: ${score}`;
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-body").classList.remove("hidden");
      loadQuestion();
    }

    function loadQuestion() {
      userSentence = [];
      selectedChoice = null;
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("submit-btn").classList.remove("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      const q = questions[currentIndex];
      document.getElementById("progress").textContent = `Question ${currentIndex + 1} / 30`;
      document.getElementById("question-text").textContent = q.prompt;

      document.getElementById("play-audio-btn").onclick = () => speak(q.audio);

      if (q.type === "build") {
        document.getElementById("sentence-builder-mode").classList.remove("hidden");
        document.getElementById("choice-mode").classList.add("hidden");
        renderSentenceBuilder(q);
      } else {
        document.getElementById("sentence-builder-mode").classList.add("hidden");
        document.getElementById("choice-mode").classList.remove("hidden");
        renderChoiceMode(q);
      }

      speak(q.audio);
    }

    function renderSentenceBuilder(q) {
      const answerSlot = document.getElementById("answer-slot");
      const tilesArea = document.getElementById("tiles-area");
      answerSlot.innerHTML = "";
      tilesArea.innerHTML = "";

      let tiles = [...q.target];
      while (tiles.length < q.target.length + 2) {
        let randomWord = vocabPool[Math.floor(Math.random() * vocabPool.length)];
        if (!tiles.includes(randomWord)) tiles.push(randomWord);
      }
      tiles = shuffleArray(tiles);

      tiles.forEach((word, idx) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.textContent = word;
        tile.id = `tile-${idx}`;
        tile.onclick = () => selectTile(word, idx);
        tilesArea.appendChild(tile);
      });
    }

    function selectTile(word, idx) {
      const tile = document.getElementById(`tile-${idx}`);
      if (tile.style.visibility === "hidden") return;

      userSentence.push({ word, idx });
      tile.style.visibility = "hidden";
      renderAnswerSlot();
    }

    function renderAnswerSlot() {
      const answerSlot = document.getElementById("answer-slot");
      answerSlot.innerHTML = "";

      userSentence.forEach((item, slotIdx) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.textContent = item.word;
        tile.onclick = () => deselectTile(slotIdx);
        answerSlot.appendChild(tile);
      });
    }

    function deselectTile(slotIdx) {
      const removed = userSentence.splice(slotIdx, 1)[0];
      document.getElementById(`tile-${removed.idx}`).style.visibility = "visible";
      renderAnswerSlot();
    }

    function renderChoiceMode(q) {
      const container = document.getElementById("choice-mode");
      container.innerHTML = "";

      let choices = shuffleArray([...q.choices]);
      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = choice;
        btn.onclick = () => {
          document.querySelectorAll(".choice-btn").forEach(b => b.style.backgroundColor = "var(--tile-bg)");
          btn.style.backgroundColor = "var(--accent)";
          btn.style.color = "#000";
          selectedChoice = choice;
        };
        container.appendChild(btn);
      });
    }

    document.getElementById("submit-btn").onclick = () => {
      const q = questions[currentIndex];
      let isCorrect = false;

      if (q.type === "build") {
        const userBuiltStr = userSentence.map(i => i.word).join("");
        const targetStr = q.target.join("");
        isCorrect = (userBuiltStr === targetStr);
      } else {
        isCorrect = (selectedChoice === q.target);
      }

      const feedback = document.getElementById("feedback");
      if (isCorrect) {
        feedback.textContent = "Correct! / 正解！";
        feedback.className = "feedback correct";
        score++;
        document.getElementById("score").textContent = `Score: ${score}`;
      } else {
        feedback.textContent = `Incorrect! Correct answer: ${Array.isArray(q.target) ? q.target.join(" ") : q.target}`;
        feedback.className = "feedback incorrect";
      }

      document.getElementById("submit-btn").classList.add("hidden");
      document.getElementById("next-btn").classList.remove("hidden");
    };

    document.getElementById("next-btn").onclick = () => {
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      document.getElementById("quiz-body").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      document.getElementById("final-score").textContent = `Your final score: ${score} / 30`;
    }

    function restartQuiz() {
      initQuiz();
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
