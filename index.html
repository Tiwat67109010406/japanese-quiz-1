<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดภาษาญี่ปุ่น (Advanced)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress {
            font-weight: bold;
            color: var(--primary);
        }

        .part-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Progress Bar Styles */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--success);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .audio-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #e0e7ff;
            font-weight: bold;
        }

        /* Unscramble Styles */
        .word-pool, .answer-zone {
            display: flex; flex-wrap: wrap; gap: 10px; min-height: 55px; padding: 12px;
            border-radius: 12px; margin-bottom: 15px;
        }
        .answer-zone { border: 2px dashed #a5b4fc; background: #f8fafc; }
        .word-chip {
            background: #ffffff; border: 1px solid #cbd5e1; padding: 10px 16px;
            border-radius: 10px; font-size: 1.1rem; cursor: pointer; user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06); transition: transform 0.2s;
        }
        .word-chip:hover { transform: translateY(-2px); border-color: var(--primary); }

        /* Matching Grid Styles */
        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .match-btn {
            background: #ffffff;
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        
        .match-btn.selected {
            border-color: var(--primary);
            background: #e0e7ff;
            transform: scale(1.02);
        }
        
        .match-btn.matched {
            border-color: var(--success);
            background: #dcfce7;
            color: #15803d;
            pointer-events: none;
            opacity: 0.6;
        }

        .action-btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .check-btn, .next-btn {
            width: 100%; color: white; border: none; padding: 12px; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .check-btn { background: var(--primary); }
        .check-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .next-btn { background: #10b981; display: none; }

        .feedback {
            margin-top: 20px; padding: 15px; border-radius: 10px; display: none;
            font-weight: 500; line-height: 1.6;
        }
        .feedback.correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .feedback.wrong { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .end-screen { text-align: center; padding: 30px 10px; }
        .end-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .restart-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <div class="header-top">
                <span class="part-badge" id="part-title">Part 1</span>
                <span class="progress" id="progress-text">ข้อ 1 / 15</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">คำถามจะแสดงตรงนี้</div>
            <button id="audio-btn" class="audio-btn" onclick="playQuestionAudio()" style="display: none;">
                🔊 ฟังเสียง
            </button>
            <div id="interactive-area"></div>
        </div>

        <div class="action-btn-group">
            <button id="check-btn" class="check-btn" onclick="checkAnswer()">เช็คคำตอบ</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">ถัดไป ➔</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="end-screen" style="display: none;">
        <h2>🎉 ทำแบบฝึกหัดเสร็จสิ้น!</h2>
        <p style="font-size: 1.5rem; font-weight: bold; margin: 20px 0;">
            คุณได้คะแนน: <span id="final-score" style="color: var(--primary);">0</span> / <span id="total-score">15</span>
        </p>
        <div class="end-buttons">
            <button class="restart-btn" onclick="startQuiz()">🔄 สุ่มเริ่มทำใหม่ (เน้นข้อที่เคยผิด)</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. เพิ่มคำศัพท์ใหม่ตรงนี้ได้เลย (Vocabulary List)
// ==========================================
const vocabularyList = [
    { j: 'ごはん', t: 'ข้าว', r: 'Gohan' },
    { j: 'みず', t: 'น้ำ', r: 'Mizu' },
    { j: 'おちゃ', t: 'ชาเขียว', r: 'Ocha' },
    { j: 'すし', t: 'ซูชิ', r: 'Sushi' },
    // เพิ่มคำศัพท์ตัวอย่างให้เห็นการขยายระบบ
    { j: 'えき', t: 'สถานีรถไฟ', r: 'Eki' },
    { j: 'くるま', t: 'รถยนต์', r: 'Kuruma' },
    { j: 'としょかん', t: 'ห้องสมุด', r: 'Toshokan' }
];

let questions = [];
let currentIndex = 0;
let score = 0;
let hasFailedThisQuestion = false;

// Variables for interactive parts
let selectedChoiceIndex = null;
let userSelectedSequence = [];
let matchingState = { selectedJp: null, selectedTh: null, matchedPairs: 0, totalPairs: 4 };

// ==========================================
// Generator & Logic
// ==========================================
function generateAllQuestions() {
    let generated = [];
    let id = 1;
    let bases = [];
    
    // สร้างประโยคพื้นฐาน
    for (let i = 0; i < vocabularyList.length; i++) {
        for (let k = 0; k < vocabularyList.length; k++) {
            if (i === k) continue;
            bases.push({
                vocabObj: vocabularyList[i], // เก็บ reference ไว้ทำ Spaced Repetition
                ja: `${vocabularyList[i].j}と${vocabularyList[k].j}、ください。`,
                th: `ขอ${vocabularyList[i].t}และ${vocabularyList[k].t}ครับ/ค่ะ`,
                romaji: `${vocabularyList[i].r} to ${vocabularyList[k].r}, kudasai.`,
                type: 'AとB',
                words: [vocabularyList[i].j, 'と', `${vocabularyList[k].j}、`, 'ください。']
            });
        }
    }
    
    vocabularyList.forEach(x => {
        bases.push({ vocabObj: x, ja: `${x.j}です。`, th: `คือ${x.t}ครับ/ค่ะ`, romaji: `${x.r} desu.`, type: 'Aです', words: [x.j, 'です。'] });
        bases.push({ vocabObj: x, ja: `${x.j}、ください。`, th: `ขอ${x.t}ครับ/ค่ะ`, romaji: `${x.r}, kudasai.`, type: 'Aください', words: [`${x.j}、`, 'ください。'] });
    });

    function getWrongOptions(correctStr, key, count) {
        let options = bases.filter(b => b[key] !== correctStr).map(b => b[key]);
        return [...new Set(options)].sort(() => 0.5 - Math.random()).slice(0, count);
    }

    // Part 1: Choice & Part 2: Listening & Part 3: Unscramble
    bases.forEach(b => {
        let opts1 = getWrongOptions(b.th, 'th', 2); opts1.push(b.th);
        generated.push({ id: id++, type: 'choice', part: 'Part 1: อ่านและแปล', q: `คำแปลของ "${b.ja}" คือข้อใด?`, options: opts1.sort(() => 0.5 - Math.random()), ansStr: b.th, vocabObj: b.vocabObj, ja: b.ja, romaji: b.romaji, th: b.th });

        let opts2 = getWrongOptions(b.ja, 'ja', 2); opts2.push(b.ja);
        generated.push({ id: id++, type: 'listening', part: 'Part 2: ฟังเสียง', q: '🔊 ฟังเสียงแล้วเลือกประโยคที่ตรงกัน', options: opts2.sort(() => 0.5 - Math.random()), ansStr: b.ja, vocabObj: b.vocabObj, ja: b.ja, romaji: b.romaji, th: b.th });

        if(b.words.length > 1) {
            let allDecoys = ['と', 'です。', 'ください。', 'みず、', 'すし、'].filter(c => !b.words.includes(c));
            let finalWords = [...b.words, ...allDecoys.sort(() => 0.5 - Math.random()).slice(0, 2)];
            generated.push({ id: id++, type: 'unscramble', part: 'Part 3: เรียงประโยค', q: `เรียงคำให้ถูกต้อง: "${b.th}"`, words: finalWords, correctSeq: b.words, vocabObj: b.vocabObj, ja: b.ja, romaji: b.romaji, th: b.th });
        }
    });

    // Part 4: Matching Pairs (สร้างโจทย์จับคู่จากคำศัพท์โดยตรง)
    for (let i = 0; i < 15; i++) {
        let shuffledVocab = [...vocabularyList].sort(() => 0.5 - Math.random()).slice(0, 4);
        generated.push({
            id: id++, type: 'matching', part: 'Part 4: จับคู่คำศัพท์', q: 'จับคู่คำศัพท์ภาษาญี่ปุ่นกับคำแปลภาษาไทยให้ถูกต้อง',
            pairs: shuffledVocab, vocabObj: shuffledVocab[0] // ผูกกับคำแรกเผื่อเก็บสถิติ
        });
    }

    return generated;
}

// ==========================================
// Spaced Repetition (localStorage)
// ==========================================
function recordMistake(vocabObj) {
    if(!vocabObj) return;
    let memory = JSON.parse(localStorage.getItem('jp_memory') || '{}');
    memory[vocabObj.j] = (memory[vocabObj.j] || 0) + 1;
    localStorage.setItem('jp_memory', JSON.stringify(memory));
}

function getSessionQuestions() {
    const allQ = generateAllQuestions();
    let memory = JSON.parse(localStorage.getItem('jp_memory') || '{}');
    
    // ให้คะแนนโจทย์ ถ้าโจทย์ไหนมีคำศัพท์ที่เคยผิดบ่อย จะโดนดึงมาทำก่อน
    allQ.forEach(q => {
        q.errorScore = q.vocabObj && memory[q.vocabObj.j] ? memory[q.vocabObj.j] : 0;
        // แรนด้อมนิดหน่อยให้ไม่ซ้ำซาก
        q.sortWeight = q.errorScore * 10 + Math.random(); 
    });

    allQ.sort((a, b) => b.sortWeight - a.sortWeight);
    return allQ.slice(0, 15).sort(() => 0.5 - Math.random()); // สลับลำดับอีกครั้งก่อนแสดง
}

// ==========================================
// UI Functions
// ==========================================
function startQuiz() {
    questions = getSessionQuestions();
    currentIndex = 0;
    score = 0;
    updateProgressBar(0);
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('end-screen').style.display = 'none';
    showQuestion();
}

function updateProgressBar(answeredCount) {
    const percentage = (answeredCount / questions.length) * 100;
    document.getElementById('progress-fill').style.width = percentage + '%';
}

function showQuestion() {
    const q = questions[currentIndex];
    hasFailedThisQuestion = false;
    
    document.getElementById('part-title').innerText = q.part;
    document.getElementById('progress-text').innerText = `ข้อ ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const area = document.getElementById('interactive-area');
    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const audioBtn = document.getElementById('audio-btn');

    area.innerHTML = '';
    feedback.style.display = 'none';
    checkBtn.style.display = 'block';
    checkBtn.disabled = false;
    nextBtn.style.display = 'none';
    audioBtn.style.display = (q.type === 'listening') ? 'inline-flex' : 'none';

    if (q.type === 'choice' || q.type === 'listening') {
        selectedChoiceIndex = null;
        const optsDiv = document.createElement('div'); optsDiv.className = 'options';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button'); btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                selectedChoiceIndex = idx;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            optsDiv.appendChild(btn);
        });
        area.appendChild(optsDiv);
    } 
    else if (q.type === 'unscramble') {
        userSelectedSequence = [];
        const ansZone = document.createElement('div'); ansZone.className = 'answer-zone'; ansZone.id = 'answer-zone';
        const pool = document.createElement('div'); pool.className = 'word-pool'; pool.id = 'word-pool';
        
        q.words.forEach(word => {
            const chip = document.createElement('div'); chip.className = 'word-chip'; chip.innerText = word;
            chip.onclick = () => {
                if(chip.parentElement === pool) { ansZone.appendChild(chip); userSelectedSequence.push(word); speakText(word); }
                else { pool.appendChild(chip); userSelectedSequence.splice(userSelectedSequence.indexOf(word), 1); }
            };
            pool.appendChild(chip);
        });
        area.appendChild(ansZone); area.appendChild(pool);
    }
    else if (q.type === 'matching') {
        matchingState = { selectedJp: null, selectedTh: null, matchedPairs: 0, totalPairs: q.pairs.length };
        checkBtn.style.display = 'none'; // ซ่อนปุ่มเช็ค สำหรับเกมจับคู่จะตรวจอัตโนมัติ
        
        const grid = document.createElement('div'); grid.className = 'matching-grid';
        
        let jpColumn = document.createElement('div'); jpColumn.style.display = 'flex'; jpColumn.style.flexDirection = 'column'; jpColumn.style.gap = '10px';
        let thColumn = document.createElement('div'); thColumn.style.display = 'flex'; thColumn.style.flexDirection = 'column'; thColumn.style.gap = '10px';

        let jList = q.pairs.map(p => p.j).sort(() => 0.5 - Math.random());
        let tList = q.pairs.map(p => p.t).sort(() => 0.5 - Math.random());

        jList.forEach(text => {
            let btn = document.createElement('div'); btn.className = 'match-btn jp-btn'; btn.innerText = text;
            btn.onclick = () => handleMatchSelect(btn, text, 'jp', q.pairs);
            jpColumn.appendChild(btn);
        });
        
        tList.forEach(text => {
            let btn = document.createElement('div'); btn.className = 'match-btn th-btn'; btn.innerText = text;
            btn.onclick = () => handleMatchSelect(btn, text, 'th', q.pairs);
            thColumn.appendChild(btn);
        });

        grid.appendChild(jpColumn); grid.appendChild(thColumn);
        area.appendChild(grid);
    }
}

function handleMatchSelect(btn, text, type, pairsList) {
    if(btn.classList.contains('matched')) return;

    if(type === 'jp') {
        document.querySelectorAll('.jp-btn').forEach(b => b.classList.remove('selected'));
        matchingState.selectedJp = { btn, text };
        speakText(text);
    } else {
        document.querySelectorAll('.th-btn').forEach(b => b.classList.remove('selected'));
        matchingState.selectedTh = { btn, text };
    }
    btn.classList.add('selected');

    if(matchingState.selectedJp && matchingState.selectedTh) {
        // Check match
        const pair = pairsList.find(p => p.j === matchingState.selectedJp.text);
        if(pair && pair.t === matchingState.selectedTh.text) {
            matchingState.selectedJp.btn.className = 'match-btn jp-btn matched';
            matchingState.selectedTh.btn.className = 'match-btn th-btn matched';
            matchingState.matchedPairs++;
            if(matchingState.matchedPairs === matchingState.totalPairs) {
                // All matched
                score++;
                updateProgressBar(score);
                document.getElementById('next-btn').style.display = 'block';
                document.getElementById('feedback').className = 'feedback correct';
                document.getElementById('feedback').innerHTML = `✅ <b>จับคู่ครบถ้วน ยอดเยี่ยมมาก!</b>`;
                document.getElementById('feedback').style.display = 'block';
            }
        } else {
            matchingState.selectedJp.btn.classList.remove('selected');
            matchingState.selectedTh.btn.classList.remove('selected');
            recordMistake(pair); // บันทึกว่าจำคู่นี้ไม่ได้
        }
        matchingState.selectedJp = null;
        matchingState.selectedTh = null;
    }
}

function checkAnswer() {
    const q = questions[currentIndex];
    let isCorrect = false;

    if (q.type === 'choice' || q.type === 'listening') {
        if (selectedChoiceIndex === null) return;
        isCorrect = (q.options[selectedChoiceIndex] === q.ansStr);
    } else if (q.type === 'unscramble') {
        if (userSelectedSequence.length === 0) return;
        isCorrect = (userSelectedSequence.join('') === q.correctSeq.join(''));
    }

    const feedback = document.getElementById('feedback');
    
    if (isCorrect) {
        if(!hasFailedThisQuestion) { score++; updateProgressBar(score); }
        feedback.className = 'feedback correct';
        feedback.innerHTML = `✅ <b>ถูกต้อง!</b><br>🇯🇵 <b>${q.ja}</b> (${q.romaji})<br>🇹🇭 ${q.th}`;
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        speakText(q.ja);
    } else {
        hasFailedThisQuestion = true;
        recordMistake(q.vocabObj); // บันทึกข้อผิดพลาดลงระบบจำ
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `❌ <b>ยังไม่ถูกต้อง ลองอีกครั้งนะครับ</b>`;
    }
    feedback.style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) showQuestion();
    else {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;
    }
}

function playQuestionAudio() {
    if(questions[currentIndex].ja) speakText(questions[currentIndex].ja);
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[。、]/g, ''));
        utterance.lang = 'ja-JP'; utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

window.onload = startQuiz;
</script>
</body>
</html>
