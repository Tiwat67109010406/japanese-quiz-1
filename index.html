<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดภาษาญี่ปุ่น 30 ข้อ</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .progress {
            font-weight: bold;
            color: var(--primary);
        }

        .part-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .audio-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .audio-btn:hover { background: #2563eb; transform: translateY(-1px); }

        /* Multiple Choice */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #e0e7ff;
            transform: translateX(4px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #e0e7ff;
            font-weight: bold;
        }

        /* Unscramble Smooth Effect (Part 3) */
        .word-pool, .answer-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 55px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .answer-zone {
            border: 2px dashed #a5b4fc;
            background: #f8fafc;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: popIn 0.3s ease forwards;
        }

        .word-chip:hover {
            transform: translateY(-3px) scale(1.03);
            border-color: var(--primary);
            box-shadow: 0 5px 12px rgba(79, 70, 229, 0.15);
        }

        .word-chip:active {
            transform: translateY(0) scale(0.97);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .action-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .check-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .next-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
        }

        .next-btn:hover { background: #059669; transform: translateY(-1px); }

        /* Feedback Box */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .feedback.wrong {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 30px 10px;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .restart-btn:hover { transform: scale(1.05); }
    </style>
</head>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <span class="part-badge" id="part-title">Part 1</span>
            <span class="progress" id="progress-text">ข้อ 1 / 30</span>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">คำถามจะแสดงตรงนี้</div>
            <button id="audio-btn" class="audio-btn" onclick="playQuestionAudio()" style="display: none;">
                🔊 กดเพื่อฟังเสียงโจทย์
            </button>
            <div id="interactive-area"></div>
        </div>

        <div class="action-btn-group">
            <button id="check-btn" class="check-btn" onclick="checkAnswer()">เช็คคำตอบ</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">ถัดไป ➔</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="end-screen" style="display: none;">
        <h2>🎉 ทำแบบฝึกหัดเสร็จสิ้น!</h2>
        <p style="font-size: 1.5rem; font-weight: bold; margin: 20px 0;">
            คุณได้คะแนนเต็ม: <span id="final-score" style="color: var(--primary);">0</span> / 30
        </p>
        <button class="restart-btn" onclick="startQuiz()">🔄 สุ่มทำใหม่อีกครั้ง</button>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const now = audioCtx.currentTime;

    if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.04);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        
        osc.start(now);
        osc.stop(now + 0.04);
    } 
    else if (type === 'correct') {
        // เสียงถูกต้องเพราะๆ ไพเราะ (C5 -> E5 -> G5 -> C6)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.3);
        });
    } 
    else if (type === 'wrong') {
        // เสียงผิด "แอ๊ด-แอ๊ด"
        [0, 0.18].forEach(delay => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, now + delay);
            gain.gain.setValueAtTime(0.25, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);

            osc.start(now + delay);
            osc.stop(now + delay + 0.15);
        });
    }
}

// พูดภาษาญี่ปุ่นเมื่อตอบถูก
function speakJapaneseText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }
}

    { type: 'unscramble', part: 'Part 3: Unscramble', q: 'เรียงคำให้ถูกต้อง: "Sushi, please."', words: ['です', 'すし、', 'と', 'おちゃ', 'ください。'], correctSeq: ['すし、', 'ください。'], ja: 'すし、ください。', romaji: 'Sushi, kudasai.', th: 'ขอซูชิครับ/ค่ะ' },
    { type: 'unscramble', part: 'Part 3: Unscramble', q: 'เรียงคำให้ถูกต้อง: "Water, please."', words: ['みず、', 'と', 'ください。', 'です', 'ごはん'], correctSeq: ['みず、', 'ください。'], ja: 'みず、ください。', romaji: 'Mizu, kudasai.', th: 'ขอน้ำครับ/ค่ะ' },
    { type: 'unscramble', part: 'Part 3: Unscramble', q: 'เรียงคำให้ถูกต้อง: "Green tea, please."', words: ['おちゃ、', 'ください。', 'ごはん', 'と', 'すし'], correctSeq: ['おちゃ、', 'ください。'], ja: 'おちゃ、ください。', romaji: 'Ocha, kudasai.', th: 'ขอชาเขียวครับ/ค่ะ' }
];

let questions = [];
let currentIndex = 0;
let score = 0;
let selectedChoiceIndex = null;
let userSelectedSequence = [];
let hasScoredThisQuestion = false; // ป้องกันการนับคะแนนซ้ำเมื่อแก้ตัว

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function playQuestionAudio() {
    const q = questions[currentIndex];
    if (q.type === 'listening') {
        speakJapaneseText(q.audioText);
    }
}

function startQuiz() {
    questions = shuffleArray(rawQuestions);
    currentIndex = 0;
    score = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('end-screen').style.display = 'none';
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    document.getElementById('part-title').innerText = q.part;
    document.getElementById('progress-text').innerText = `ข้อ ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const audioBtn = document.getElementById('audio-btn');
    const area = document.getElementById('interactive-area');

    feedback.style.display = 'none';
    checkBtn.style.display = 'block';
    nextBtn.style.display = 'none';
    selectedChoiceIndex = null;
    userSelectedSequence = [];
    hasScoredThisQuestion = false;
    area.innerHTML = '';

    if (q.type === 'listening') {
        audioBtn.style.display = 'inline-flex';
    } else {
        audioBtn.style.display = 'none';
    }

    if (q.type === 'choice' || q.type === 'listening') {
        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectChoiceOption(idx, btn);
            optsDiv.appendChild(btn);
        });
        area.appendChild(optsDiv);
    } else if (q.type === 'unscramble') {
        const answerZone = document.createElement('div');
        answerZone.className = 'answer-zone';
        answerZone.id = 'answer-zone';
        
        const wordPool = document.createElement('div');
        wordPool.className = 'word-pool';
        wordPool.id = 'word-pool';

        const shuffledWords = shuffleArray(q.words);
        shuffledWords.forEach((word) => {
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.innerText = word;
            chip.onclick = () => toggleWordChip(chip, word);
            wordPool.appendChild(chip);
        });

        area.appendChild(answerZone);
        area.appendChild(wordPool);
    }
}

function selectChoiceOption(idx, btn) {
    playSound('click');
    selectedChoiceIndex = idx;
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function toggleWordChip(chip, word) {
    playSound('click');
    const answerZone = document.getElementById('answer-zone');
    const wordPool = document.getElementById('word-pool');

    if (chip.parentElement === wordPool) {
        answerZone.appendChild(chip);
        userSelectedSequence.push(word);
    } else {
        wordPool.appendChild(chip);
        const index = userSelectedSequence.indexOf(word);
        if (index > -1) userSelectedSequence.splice(index, 1);
    }
}

function checkAnswer() {
    const q = questions[currentIndex];
    let isCorrect = false;

    if (q.type === 'choice' || q.type === 'listening') {
        if (selectedChoiceIndex === null) {
            alert('กรุณาเลือกคำตอบก่อนกดเช็คคำตอบครับ');
            return;
        }
        isCorrect = (selectedChoiceIndex === q.ans);
    } else if (q.type === 'unscramble') {
        if (userSelectedSequence.length === 0) {
            alert('กรุณาเรียงประโยคก่อนกดเช็คคำตอบครับ');
            return;
        }
        const userStr = userSelectedSequence.join('');
        const correctStr = q.correctSeq.join('');
        isCorrect = (userStr === correctStr);
    }

    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');

    if (isCorrect) {
        playSound('correct');
        // พูดคำตอบภาษาญี่ปุ่นทันทีหลังจากเสียงถูกขึ้น
        setTimeout(() => {
            speakJapaneseText(q.ja);
        }, 350);

        if (!hasScoredThisQuestion) {
            score++;
            hasScoredThisQuestion = true;
        }

        disableInputs();

        feedback.className = 'feedback correct';
        feedback.innerHTML = `
            ✅ <b>ถูกต้อง!</b><br>
            🇯🇵 <b>คำตอบ:</b> ${q.ja}<br>
            🗣️ <b>เสียงอ่าน (Romaji):</b> ${q.romaji}<br>
            🇹🇭 <b>คำแปล:</b> ${q.th}
        `;
        checkBtn.style.display = 'none';
        nextBtn.style.display = 'block';
    } else {
        playSound('wrong');
        // หากตอบผิด ไม่ต้องเฉลย และให้กดตอบใหม่ได้
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `❌ <b>ยังไม่ถูกต้อง! ลองเลือกคำตอบใหม่อีกครั้งนะครับ</b>`;
    }

    feedback.style.display = 'block';
}

function disableInputs() {
    const btns = document.querySelectorAll('.option-btn, .word-chip');
    btns.forEach(btn => {
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.7';
    });
}

function nextQuestion() {
    playSound('click');
    currentIndex++;
    if (currentIndex < questions.length) {
        showQuestion();
    } else {
        showEndScreen();
    }
}

function showEndScreen() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    document.getElementById('final-score').innerText = score;
}

window.onload = startQuiz;
</script>

</html>
