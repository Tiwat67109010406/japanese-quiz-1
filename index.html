<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดภาษาญี่ปุ่น - ขั้นแอดวานซ์</title>
    <style>
        :root {
            --primary: #58cc02; 
            --primary-hover: #46a302;
            --bg: #ffffff;
            --text: #3c3c3c;
            --danger: #ff4b4b;
        }

        body {
            font-family: 'Sarabun', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 1. Animated Progress Bar */
        .progress-container {
            width: 100%;
            height: 16px;
            background: #e5e5e5;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            display: flex;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            /* อนิเมชันหลอดเลือดวิ่ง */
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 10px;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 5px;
            right: 5px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .audio-btn {
            background: #1cb0f6;
            color: white;
            border: none;
            border-bottom: 4px solid #1899d6;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .audio-btn:active { border-bottom: 0px; transform: translateY(4px); }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: white;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .option-btn:hover { background: #f7f7f7; transform: translateY(-2px); }
        .option-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .option-btn.selected {
            border-color: #84d8ff;
            background: #ddf4ff;
            border-bottom-color: #38bdf8;
            transform: scale(1.02);
        }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .match-item {
            padding: 15px 10px;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            border-radius: 12px;
            text-align: center;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            background: white;
            transition: all 0.2s;
        }
        .match-item:hover { background: #f7f7f7; transform: translateY(-2px); }
        .match-item:active { transform: translateY(2px); border-bottom-width: 2px; }
        .match-item.selected {
            border-color: #84d8ff;
            background: #ddf4ff;
            border-bottom-color: #38bdf8;
            transform: scale(1.05);
        }
        
        /* อนิเมชันตอนจับคู่ถูก (Pop & Disappear) */
        .match-item.matched {
            animation: popOut 0.4s forwards;
            pointer-events: none;
        }
        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* อนิเมชันตอนจับคู่ผิด (สั่นแรงๆ) */
        .match-item.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--danger);
            background: #ffdfe0;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }

        .action-btn-group { margin-top: 25px; }
        .check-btn, .next-btn {
            width: 100%;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .check-btn { background: var(--primary); border-bottom: 4px solid var(--primary-hover); }
        .check-btn:active { border-bottom: 0px; transform: translateY(4px); }
        
        .next-btn { background: #1cb0f6; border-bottom: 4px solid #1899d6; display: none; }
        .next-btn:active { border-bottom: 0px; transform: translateY(4px); }

        /* เอฟเฟกต์ตอบกลับเด้งดึ๋ง (Juicy Feedback) */
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            display: none;
            font-size: 1.2rem;
            font-weight: bold;
            transform-origin: bottom center;
        }
        
        .feedback.show {
            display: block;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            50% { transform: scale(1.05) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .feedback.correct { background: #d7ffb8; color: #46a302; border: 2px solid #b8f28b; }
        .feedback.wrong { background: #ffdfe0; color: #ea2b2b; border: 2px solid #ffb3b8; }
        
        .feedback-icon {
            font-size: 2rem;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">คำถามจะแสดงตรงนี้</div>
            <button id="audio-btn" class="audio-btn" onclick="playQuestionAudio()" style="display: none;">🔊 ฟังเสียง</button>
            <div id="interactive-area"></div>
        </div>

        <div id="feedback" class="feedback">
            <span id="feedback-icon" class="feedback-icon"></span>
            <span id="feedback-text"></span>
        </div>

        <div class="action-btn-group">
            <button id="check-btn" class="check-btn" onclick="checkAnswer()">ตรวจคำตอบ</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">ไปต่อเลย!</button>
        </div>
    </div>
</div>

<script>
const dictionary = [
    { j: 'ごはん', t: 'ข้าว', r: 'Gohan' },
    { j: 'みず', t: 'น้ำ', r: 'Mizu' },
    { j: 'おちゃ', t: 'ชาเขียว', r: 'Ocha' },
    { j: 'すし', t: 'ซูชิ', r: 'Sushi' },
    { j: 'にく', t: 'เนื้อ', r: 'Niku' },
    { j: 'さかな', t: 'ปลา', r: 'Sakana' },
    { j: 'えき', t: 'สถานีรถไฟ', r: 'Eki' },
    { j: 'くるま', t: 'รถยนต์', r: 'Kuruma' }
];

let allQuestions = [];
let idCounter = 1;

for (let i = 0; i < dictionary.length; i += 4) {
    if(i + 4 <= dictionary.length) {
        allQuestions.push({
            id: 'match_' + idCounter++, type: 'matching', q: 'จับคู่คำศัพท์ให้ถูกต้อง', pairs: dictionary.slice(i, i+4)
        });
    }
}

dictionary.forEach(word => {
    let wrongTh = dictionary.filter(d => d.t !== word.t).sort(() => 0.5 - Math.random()).map(d => d.t).slice(0, 3);
    wrongTh.push(word.t);
    allQuestions.push({ id: 'vocab_ja_th_' + idCounter++, type: 'choice', q: `คำแปลของ "${word.j}" คือข้อใด?`, options: wrongTh.sort(() => 0.5 - Math.random()), ans: word.t, ja: word.j, th: word.t });
});

function getMistakeStats() { return JSON.parse(localStorage.getItem('spacedRepetitionStats') || '{}'); }
function recordMistake(questionId) {
    let stats = getMistakeStats();
    stats[questionId] = (stats[questionId] || 0) + 1;
    localStorage.setItem('spacedRepetitionStats', JSON.stringify(stats));
}

function selectQuestionsForSession(poolSize = 10) {
    let stats = getMistakeStats();
    let sorted = [...allQuestions].sort((a, b) => ((stats[b.id] || 0) + Math.random()) - ((stats[a.id] || 0) + Math.random()));
    return sorted.slice(0, poolSize);
}

let currentSessionQs = [];
let currentIndex = 0;
let userSelection = null;
let matchPairsLeft = 0;
let selectedMatchBtn = null;

function startSession() {
    currentSessionQs = selectQuestionsForSession(10);
    currentIndex = 0;
    updateProgress(0);
    showQuestion();
}

function updateProgress(correctCount) {
    let percent = (correctCount / currentSessionQs.length) * 100;
    document.getElementById('progress-bar').style.width = percent + '%';
}

function showQuestion() {
    const q = currentSessionQs[currentIndex];
    document.getElementById('question-text').innerText = q.q;
    const area = document.getElementById('interactive-area');
    area.innerHTML = '';
    
    // รีเซ็ตแอนิเมชันเฉลย
    const fb = document.getElementById('feedback');
    fb.classList.remove('show', 'correct', 'wrong');
    fb.style.display = 'none';
    
    document.getElementById('check-btn').style.display = (q.type === 'matching') ? 'none' : 'block';
    document.getElementById('next-btn').style.display = 'none';
    userSelection = null;

    if (q.type === 'choice' || q.type === 'listening') {
        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                userSelection = opt;
            };
            optsDiv.appendChild(btn);
        });
        area.appendChild(optsDiv);
    } 
    else if (q.type === 'matching') { renderMatchingGame(q.pairs, area); }
}

function renderMatchingGame(pairs, container) {
    const grid = document.createElement('div');
    grid.className = 'match-grid';
    matchPairsLeft = pairs.length;
    selectedMatchBtn = null;

    let items = [];
    pairs.forEach(p => {
        items.push({ text: p.j, matchId: p.j, lang: 'ja' });
        items.push({ text: p.t, matchId: p.j, lang: 'th' });
    });
    items.sort(() => 0.5 - Math.random());

    items.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'match-item';
        btn.innerText = item.text;
        btn.dataset.id = item.matchId;
        btn.dataset.lang = item.lang;
        btn.onclick = () => handleMatchClick(btn);
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

function handleMatchClick(btn) {
    if (btn.classList.contains('matched') || btn.classList.contains('selected')) return;

    if (!selectedMatchBtn) {
        btn.classList.add('selected');
        selectedMatchBtn = btn;
    } else {
        if (selectedMatchBtn.dataset.lang !== btn.dataset.lang && selectedMatchBtn.dataset.id === btn.dataset.id) {
            btn.classList.add('matched');
            selectedMatchBtn.classList.add('matched');
            selectedMatchBtn = null;
            matchPairsLeft--;
            if (matchPairsLeft === 0) {
                updateProgress(currentIndex + 1);
                document.getElementById('next-btn').style.display = 'block';
                showFeedback(true, "ยอดเยี่ยม! จับคู่ครบทั้งหมดแล้ว", "🎉");
            }
        } else {
            recordMistake(currentSessionQs[currentIndex].id);
            btn.classList.add('shake');
            selectedMatchBtn.classList.add('shake');
            let tempBtn = selectedMatchBtn;
            selectedMatchBtn = null;
            setTimeout(() => {
                btn.classList.remove('shake');
                tempBtn.classList.remove('shake', 'selected');
            }, 400);
        }
    }
}

function checkAnswer() {
    const q = currentSessionQs[currentIndex];
    if (!userSelection) return alert("กรุณาเลือกคำตอบครับ!");
    const isCorrect = (userSelection === q.ans);
    
    if (isCorrect) {
        updateProgress(currentIndex + 1);
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        showFeedback(true, `ถูกต้อง! ${q.ja} แปลว่า ${q.th}`, "🥳");
    } else {
        recordMistake(q.id);
        showFeedback(false, "ยังไม่ใช่ ลองเลือกคำตอบอื่นดูนะ", "😅");
    }
}

function showFeedback(isCorrect, text, emoji) {
    const fb = document.getElementById('feedback');
    fb.classList.remove('show', 'correct', 'wrong'); // ล้างแอนิเมชันเดิมออกก่อน
    
    // บังคับให้เบราว์เซอร์รีเฟรช DOM เพื่อให้แอนิเมชันเล่นซ้ำได้
    void fb.offsetWidth; 
    
    document.getElementById('feedback-icon').innerText = emoji;
    document.getElementById('feedback-text').innerText = text;
    fb.classList.add(isCorrect ? 'correct' : 'wrong', 'show');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentSessionQs.length) { showQuestion(); } 
    else { alert("ยินดีด้วย! คุณเรียนจบเซ็ตนี้แล้ว 🎉"); startSession(); }
}

window.onload = startSession;
</script>
</body>
</html>
