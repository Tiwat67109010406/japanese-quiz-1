<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดภาษาญี่ปุ่น 30 ข้อ</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .progress {
            font-weight: bold;
            color: var(--primary);
        }

        .part-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .audio-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .audio-btn:hover { background: #2563eb; transform: translateY(-1px); }

        /* Multiple Choice */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #e0e7ff;
            transform: translateX(4px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #e0e7ff;
            font-weight: bold;
        }

        /* Unscramble Smooth Effect (Part 3) */
        .word-pool, .answer-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 55px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .answer-zone {
            border: 2px dashed #a5b4fc;
            background: #f8fafc;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: popIn 0.3s ease forwards;
        }

        .word-chip:hover {
            transform: translateY(-3px) scale(1.03);
            border-color: var(--primary);
            box-shadow: 0 5px 12px rgba(79, 70, 229, 0.15);
        }

        .word-chip:active {
            transform: translateY(0) scale(0.97);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .action-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .check-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .next-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
        }

        .next-btn:hover { background: #059669; transform: translateY(-1px); }

        /* Feedback Box */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .feedback.wrong {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 30px 10px;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .restart-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <span class="part-badge" id="part-title">Part 1</span>
            <span class="progress" id="progress-text">ข้อ 1 / 30</span>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">คำถามจะแสดงตรงนี้</div>
            <button id="audio-btn" class="audio-btn" onclick="playQuestionAudio()" style="display: none;">
                🔊 กดเพื่อฟังเสียงโจทย์
            </button>
            <div id="interactive-area"></div>
        </div>

        <div class="action-btn-group">
            <button id="check-btn" class="check-btn" onclick="checkAnswer()">เช็คคำตอบ</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">ถัดไป ➔</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="end-screen" style="display: none;">
        <h2>🎉 ทำแบบฝึกหัดเสร็จสิ้น!</h2>
        <p style="font-size: 1.5rem; font-weight: bold; margin: 20px 0;">
            คุณได้คะแนน: <span id="final-score" style="color: var(--primary);">0</span> / 30
        </p>
        <button class="restart-btn" onclick="startQuiz()">🔄 สุ่มทำใหม่อีกครั้ง</button>
    </div>
</div>

<script>
// Web Audio API สำหรับระบบเสียงเอฟเฟกต์
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const now = audioCtx.currentTime;

    if (type === 'click') {
        // เสียงป๊อบ/คลิก Smooth เมื่อกดเรียงคำ
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.04);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        
        osc.start(now);
        osc.stop(now + 0.04);
    } 
    else if (type === 'correct') {
        // เสียงถูก "ตื่อ-ดือ-ดื๊ด" (C5 -> E5 -> G5)
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);

            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.2);
        });
    } 
    else if (type === 'wrong') {
        // เสียงผิด "แอ๊ด-แอ๊ด" (Low Sawtooth Dual Pitch)
        [0, 0.18].forEach(delay => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, now + delay);
            gain.gain.setValueAtTime(0.3, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);

            osc.start(now + delay);
            osc.stop(now + delay + 0.15);
        });
    }
}

// คลังข้อมูลแบบฝึกหัด
