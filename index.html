<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดภาษาญี่ปุ่น - ขั้นแอดวานซ์</title>
    <style>
        :root {
            --primary: #58cc02; /* สีเขียวสไตล์ดูลิงโก้ */
            --primary-hover: #46a302;
            --bg: #ffffff;
            --card: #ffffff;
            --text: #3c3c3c;
            --danger: #ff4b4b;
        }

        body {
            font-family: 'Sarabun', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 1. Animated Progress Bar */
        .progress-container {
            width: 100%;
            height: 16px;
            background: #e5e5e5;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            display: flex;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
            position: relative;
        }

        /* เอฟเฟกต์แสงสะท้อนบนหลอดเลือดสไตล์เกม */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 5px;
            right: 5px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .audio-btn {
            background: #1cb0f6;
            color: white;
            border: none;
            border-bottom: 4px solid #1899d6;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .audio-btn:active { border-bottom: 0px; transform: translateY(4px); }

        /* ตัวเลือกทั่วไป */
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: white;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s;
        }
        .option-btn:hover { background: #f7f7f7; }
        .option-btn.selected {
            border-color: #84d8ff;
            background: #ddf4ff;
            border-bottom-color: #38bdf8;
        }

        /* 2. ระบบจับคู่คำศัพท์ (Matching Grid) */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .match-item {
            padding: 15px 10px;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            border-radius: 12px;
            text-align: center;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            background: white;
        }
        .match-item.selected {
            border-color: #84d8ff;
            background: #ddf4ff;
            border-bottom-color: #38bdf8;
        }
        .match-item.matched {
            visibility: hidden;
            pointer-events: none;
        }
        .match-item.shake {
            animation: shake 0.4s;
            border-color: var(--danger);
            background: #ffdfe0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .action-btn-group { margin-top: 25px; }
        .check-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 4px solid var(--primary-hover);
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .check-btn:active { border-bottom: 0px; transform: translateY(4px); }

        .next-btn {
            width: 100%;
            background: #1cb0f6;
            color: white;
            border: none;
            border-bottom: 4px solid #1899d6;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .next-btn:active { border-bottom: 0px; transform: translateY(4px); }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            display: none;
            font-size: 1.1rem;
        }
        .feedback.correct { background: #d7ffb8; color: #46a302; font-weight: bold; }
        .feedback.wrong { background: #ffdfe0; color: #ea2b2b; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">คำถามจะแสดงตรงนี้</div>
            <button id="audio-btn" class="audio-btn" onclick="playQuestionAudio()" style="display: none;">🔊 ฟังเสียง</button>
            <div id="interactive-area"></div>
        </div>

        <div id="feedback" class="feedback"></div>

        <div class="action-btn-group">
            <button id="check-btn" class="check-btn" onclick="checkAnswer()">ตรวจคำตอบ</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">ไปต่อเลย!</button>
        </div>
    </div>
</div>

<script>
// ----------------------------------------------------
// ระบบคลังคำศัพท์ (เพิ่มคำที่นี่ในอนาคตได้เลย ระบบจะสร้างโจทย์ออโต้)
// ----------------------------------------------------
const dictionary = [
    { j: 'ごはん', t: 'ข้าว', r: 'Gohan' },
    { j: 'みず', t: 'น้ำ', r: 'Mizu' },
    { j: 'おちゃ', t: 'ชาเขียว', r: 'Ocha' },
    { j: 'すし', t: 'ซูชิ', r: 'Sushi' },
    { j: 'にく', t: 'เนื้อ', r: 'Niku' },
    { j: 'さかな', t: 'ปลา', r: 'Sakana' },
    { j: 'えき', t: 'สถานีรถไฟ', r: 'Eki' },
    { j: 'くるま', t: 'รถยนต์', r: 'Kuruma' }
];

// ----------------------------------------------------
// ระบบสร้างโจทย์อัตโนมัติ
// ----------------------------------------------------
let allQuestions = [];
let idCounter = 1;

// 1. สร้างโจทย์จับคู่คำศัพท์ (Matching)
for (let i = 0; i < dictionary.length; i += 4) {
    if(i + 4 <= dictionary.length) {
        let chunk = dictionary.slice(i, i+4);
        allQuestions.push({
            id: 'match_' + idCounter++,
            type: 'matching',
            q: 'จับคู่คำศัพท์ให้ถูกต้อง',
            pairs: chunk
        });
    }
}

// 2. สร้างโจทย์อ่าน แปล และฟัง
dictionary.forEach(word => {
    let wrongTh = dictionary.filter(d => d.t !== word.t).sort(() => 0.5 - Math.random()).map(d => d.t).slice(0, 3);
    wrongTh.push(word.t);
    
    allQuestions.push({
        id: 'vocab_ja_th_' + idCounter++,
        type: 'choice',
        q: `คำแปลของ "${word.j}" คือข้อใด?`,
        options: wrongTh.sort(() => 0.5 - Math.random()),
        ans: word.t, ja: word.j, th: word.t
    });

    allQuestions.push({
        id: 'listen_' + idCounter++,
        type: 'listening',
        q: '🔊 ฟังเสียงแล้วเลือกคำแปลที่ตรงกัน',
        audioText: word.j,
        options: wrongTh.sort(() => 0.5 - Math.random()),
        ans: word.t, ja: word.j, th: word.t
    });
});

// ----------------------------------------------------
// ระบบ Spaced Repetition (จำข้อที่ผิดบ่อยดึงมาออกซ้ำ)
// ----------------------------------------------------
function getMistakeStats() {
    return JSON.parse(localStorage.getItem('spacedRepetitionStats') || '{}');
}

function recordMistake(questionId) {
    let stats = getMistakeStats();
    stats[questionId] = (stats[questionId] || 0) + 1;
    localStorage.setItem('spacedRepetitionStats', JSON.stringify(stats));
}

function selectQuestionsForSession(poolSize = 15) {
    let stats = getMistakeStats();
    // เรียงโจทย์: ข้อที่ผิดบ่อยให้อยู่บนสุด, ถ้ายอดผิดเท่ากันให้สุ่ม (เพื่อให้เกิดความคละเคล้า)
    let sortedQuestions = [...allQuestions].sort((a, b) => {
        let weightA = (stats[a.id] || 0) + Math.random();
        let weightB = (stats[b.id] || 0) + Math.random();
        return weightB - weightA; 
    });
    return sortedQuestions.slice(0, poolSize);
}

// ----------------------------------------------------
// กลไกการทำแบบทดสอบ
// ----------------------------------------------------
let currentSessionQs = [];
let currentIndex = 0;
let score = 0;
let userSelection = null;

// สำหรับเกมจับคู่
let matchPairsLeft = 0;
let selectedMatchBtn = null;

function startSession() {
    currentSessionQs = selectQuestionsForSession(10); // ทดสอบดึงมา 10 ข้อต่อรอบ
    currentIndex = 0;
    updateProgress(0);
    showQuestion();
}

function updateProgress(correctCount) {
    let percent = (correctCount / currentSessionQs.length) * 100;
    document.getElementById('progress-bar').style.width = percent + '%';
}

function showQuestion() {
    const q = currentSessionQs[currentIndex];
    document.getElementById('question-text').innerText = q.q;
    const area = document.getElementById('interactive-area');
    area.innerHTML = '';
    
    document.getElementById('feedback').style.display = 'none';
    
    // จัดการปุ่ม Check / Next
    const checkBtn = document.getElementById('check-btn');
    if (q.type === 'matching') {
        checkBtn.style.display = 'none'; // เกมจับคู่ตรวจแบบเรียลไทม์
    } else {
        checkBtn.style.display = 'block';
    }
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('audio-btn').style.display = (q.type === 'listening') ? 'block' : 'none';

    userSelection = null;

    if (q.type === 'choice' || q.type === 'listening') {
        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                userSelection = opt;
            };
            optsDiv.appendChild(btn);
        });
        area.appendChild(optsDiv);
    } 
    else if (q.type === 'matching') {
        renderMatchingGame(q.pairs, area);
    }
}

function renderMatchingGame(pairs, container) {
    const grid = document.createElement('div');
    grid.className = 'match-grid';
    matchPairsLeft = pairs.length;
    selectedMatchBtn = null;

    let items = [];
    pairs.forEach(p => {
        items.push({ text: p.j, matchId: p.j, lang: 'ja' });
        items.push({ text: p.t, matchId: p.j, lang: 'th' }); // ใช้คำญี่ปุ่นเป็น ID จับคู่
    });
    
    items.sort(() => 0.5 - Math.random()); // สับไพ่กระจุย

    items.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'match-item';
        btn.innerText = item.text;
        btn.dataset.id = item.matchId;
        btn.dataset.lang = item.lang;
        
        btn.onclick = () => handleMatchClick(btn, q);
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

function handleMatchClick(btn) {
    if (btn.classList.contains('matched') || btn.classList.contains('selected')) return;

    if (!selectedMatchBtn) {
        btn.classList.add('selected');
        selectedMatchBtn = btn;
    } else {
        // กดปุ่มที่สอง ทำการเช็ค
        if (selectedMatchBtn.dataset.lang !== btn.dataset.lang && selectedMatchBtn.dataset.id === btn.dataset.id) {
            // จับคู่ถูก
            btn.classList.add('matched');
            selectedMatchBtn.classList.add('matched');
            selectedMatchBtn = null;
            matchPairsLeft--;
            
            if (matchPairsLeft === 0) {
                // จบเกมจับคู่
                updateProgress(currentIndex + 1);
                document.getElementById('next-btn').style.display = 'block';
                showFeedback(true, "ยอดเยี่ยม! จับคู่ครบทั้งหมดแล้ว");
            }
        } else {
            // จับคู่ผิด
            recordMistake(currentSessionQs[currentIndex].id);
            btn.classList.add('shake');
            selectedMatchBtn.classList.add('shake');
            setTimeout(() => {
                btn.classList.remove('shake');
                selectedMatchBtn.classList.remove('shake', 'selected');
                selectedMatchBtn = null;
            }, 400);
        }
    }
}

function checkAnswer() {
    const q = currentSessionQs[currentIndex];
    
    if (!userSelection) return alert("กรุณาเลือกคำตอบครับ!");

    const isCorrect = (userSelection === q.ans);
    
    if (isCorrect) {
        updateProgress(currentIndex + 1);
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        showFeedback(true, `ถูกกต้อง! ${q.ja} แปลว่า ${q.th}`);
    } else {
        recordMistake(q.id); // บันทึกลง Spaced Repetition (localStorage)
        showFeedback(false, "ยังไม่ใช่ ลองเลือกคำตอบอื่นดูนะ");
    }
}

function showFeedback(isCorrect, text) {
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
    fb.innerText = text;
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentSessionQs.length) {
        showQuestion();
    } else {
        alert("ยินดีด้วย! คุณเรียนจบเซ็ตนี้แล้ว 🎉");
        startSession(); // วนลูปเริ่มใหม่ (มันจะดึงข้อที่เราทำผิดบ่อยในเซ็ตนี้มาออกซ้ำในรอบหน้า)
    }
}

window.onload = startSession;
</script>
</body>
</html>
