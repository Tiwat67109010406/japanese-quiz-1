<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดภาษาญี่ปุ่น (Auto-Generated)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .progress {
            font-weight: bold;
            color: var(--primary);
        }

        .part-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .audio-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .audio-btn:hover { background: #2563eb; transform: translateY(-1px); }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #e0e7ff;
            transform: translateX(4px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #e0e7ff;
            font-weight: bold;
        }

        .word-pool, .answer-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 55px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .answer-zone {
            border: 2px dashed #a5b4fc;
            background: #f8fafc;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: popIn 0.3s ease forwards;
        }

        .word-chip:hover {
            transform: translateY(-3px) scale(1.03);
            border-color: var(--primary);
            box-shadow: 0 5px 12px rgba(79, 70, 229, 0.15);
        }

        .word-chip:active {
            transform: translateY(0) scale(0.97);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .action-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .check-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .next-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
        }

        .next-btn:hover { background: #059669; transform: translateY(-1px); }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .feedback.wrong {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .end-screen {
            text-align: center;
            padding: 30px 10px;
        }

        .end-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .restart-btn:hover { transform: scale(1.02); background: var(--primary-hover); }

        .retry-mistakes-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-mistakes-btn:hover { transform: scale(1.02); background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <span class="part-badge" id="part-title">Part 1</span>
            <span class="progress" id="progress-text">ข้อ 1 / 30</span>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">คำถามจะแสดงตรงนี้</div>
            <button id="audio-btn" class="audio-btn" onclick="playQuestionAudio()" style="display: none;">
                🔊 กดเพื่อฟังเสียงโจทย์
            </button>
            <div id="interactive-area"></div>
        </div>

        <div class="action-btn-group">
            <button id="check-btn" class="check-btn" onclick="checkAnswer()">เช็คคำตอบ</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">ถัดไป ➔</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="end-screen" style="display: none;">
        <h2>🎉 ทำแบบฝึกหัดเสร็จสิ้น!</h2>
        <p style="font-size: 1.5rem; font-weight: bold; margin: 20px 0;">
            คุณได้คะแนน: <span id="final-score" style="color: var(--primary);">0</span> / <span id="total-score">30</span>
        </p>
        
        <div class="end-buttons">
            <button id="retry-mistakes-btn" class="retry-mistakes-btn" onclick="startMistakesQuiz()" style="display: none;">
                ❌ ทำข้อที่ผิดซ้ำ (<span id="wrong-count">0</span> ข้อ)
            </button>
            <button class="restart-btn" onclick="startQuiz()">🔄 สุ่มเริ่มทำใหม่ (เซ็ตใหม่)</button>
        </div>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

window.speechSynthesis.getVoices(); 
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
}

function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const now = audioCtx.currentTime;
    if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(850, now + 0.04);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        osc.start(now); osc.stop(now + 0.04);
    } 
    else if (type === 'correct') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08); gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.3);
        });
    } 
    else if (type === 'wrong') {
        [0, 0.18].forEach(delay => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(130, now + delay);
            gain.gain.setValueAtTime(0.25, now + delay); gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
            osc.start(now + delay); osc.stop(now + delay + 0.15);
        });
    }
}

function speakJapaneseText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[。、！!]/g, '').trim();
        if (cleanText === '') return;
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP'; utterance.rate = 0.85;
            const voices = window.speechSynthesis.getVoices();
            const jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang.includes('ja'));
            if (jaVoice) utterance.voice = jaVoice;
            window.speechSynthesis.speak(utterance);
        }, 50);
    }
}

// ----------------------------------------------------
// ระบบสร้างโจทย์อัตโนมัติ (Generator) 
// ----------------------------------------------------
const rawQuestions = (function generateAllQuestions() {
    let questions = [];
    let id = 1;
    
    const v = [
        { j: 'ごはん', t: 'ข้าว', r: 'Gohan' },
        { j: 'みず', t: 'น้ำ', r: 'Mizu' },
        { j: 'おちゃ', t: 'ชาเขียว', r: 'Ocha' },
        { j: 'すし', t: 'ซูชิ', r: 'Sushi' }
    ];

    let bases = [];
    
    for (let i = 0; i < v.length; i++) {
        for (let k = 0; k < v.length; k++) {
            if (i === k) continue;
            bases.push({
                ja: `${v[i].j}と${v[k].j}、ください。`,
                th: `ขอ${v[i].t}และ${v[k].t}ครับ/ค่ะ`,
                romaji: `${v[i].r} to ${v[k].r}, kudasai.`,
                type: 'AとB',
                words: [v[i].j, 'と', `${v[k].j}、`, 'ください。']
            });
        }
    }
    
    v.forEach(x => bases.push({ ja: `${x.j}です。`, th: `คือ${x.t}ครับ/ค่ะ`, romaji: `${x.r} desu.`, type: 'Aです', words: [x.j, 'です。'] }));
    v.forEach(x => bases.push({ ja: `${x.j}、ください。`, th: `ขอ${x.t}ครับ/ค่ะ`, romaji: `${x.r}, kudasai.`, type: 'Aください', words: [`${x.j}、`, 'ください。'] }));
    v.forEach(x => bases.push({ ja: x.j, th: x.t, romaji: x.r, type: 'A', words: [x.j] }));

    function getWrongOptions(correctStr, key, count) {
        let options = bases.filter(b => b[key] !== correctStr).map(b => b[key]);
        options.sort(() => 0.5 - Math.random());
        return [...new Set(options)].slice(0, count);
    }

    // Part 1: Choice (48 ข้อ)
    bases.forEach(b => {
        let opts1 = getWrongOptions(b.th, 'th', 2);
        opts1.push(b.th);
        opts1.sort(() => 0.5 - Math.random());
        questions.push({
            id: id++, type: 'choice', part: 'Part 1: อ่านและแปล', 
            q: `คำแปลของ "${b.ja}" คือข้อใด?`, options: opts1, ans: opts1.indexOf(b.th),
            ja: b.ja, romaji: b.romaji, th: b.th
        });

        let opts2 = getWrongOptions(b.ja, 'ja', 2);
        opts2.push(b.ja);
        opts2.sort(() => 0.5 - Math.random());
        questions.push({
            id: id++, type: 'choice', part: 'Part 1: อ่านและแปล', 
            q: `ภาษาญี่ปุ่นของ "${b.th}" คือข้อใด?`, options: opts2, ans: opts2.indexOf(b.ja),
            ja: b.ja, romaji: b.romaji, th: b.th
        });
    });

    // Part 2: Listening (24 ข้อ)
    bases.forEach(b => {
        let opts = getWrongOptions(b.ja, 'ja', 2);
        opts.push(b.ja);
        opts.sort(() => 0.5 - Math.random());
        questions.push({
            id: id++, type: 'listening', part: 'Part 2: ฟังเสียง', 
            q: '🔊 ฟังเสียงแล้วเลือกประโยคภาษาญี่ปุ่นที่ตรงกัน', audioText: b.ja, 
            options: opts, ans: opts.indexOf(b.ja),
            ja: b.ja, romaji: b.romaji, th: b.th
        });
    });

    // Part 3: Unscramble (20 ข้อ)
    const allChips = ['ごはん', 'みず', 'おちゃ', 'すし', 'と', 'です。', 'ください。', 'みず、', 'すし、', 'おちゃ、', 'ごはん、'];
    bases.filter(b => b.type !== 'A').forEach(b => {
        let decoys = allChips.filter(c => !b.words.includes(c)).sort(() => 0.5 - Math.random()).slice(0, 2);
        let finalWords = [...b.words, ...decoys];
        questions.push({
            id: id++, type: 'unscramble', part: 'Part 3: เรียงประโยค', 
            q: `เรียงคำให้ถูกต้อง: "${b.th}"`, words: finalWords, correctSeq: b.words, 
            ja: b.ja, romaji: b.romaji, th: b.th
        });
    });

    return questions;
})();

// ----------------------------------------------------
// UI & Logic
// ----------------------------------------------------
let questions = [];
let wrongQuestions = [];
let currentIndex = 0;
let score = 0;
let selectedChoiceIndex = null;
let userSelectedSequence = [];
let hasScoredThisQuestion = false; 
let hasFailedThisQuestion = false;

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function playQuestionAudio() {
    const q = questions[currentIndex];
    if (q.type === 'listening') {
        speakJapaneseText(q.audioText);
    }
}

function startQuiz() {
    // ดึงโจทย์มาทั้งหมด 92 ข้อ สลับลำดับ แล้วตัดมาให้ทำแค่รอบละ 30 ข้อเพื่อไม่ให้ยาวเกินไป
    // หากต้องการให้ทำทั้ง 92 ข้อ ให้ลบ .slice(0, 30) ออกครับ
    questions = shuffleArray(rawQuestions).slice(0, 30);
    wrongQuestions = [];
    resetAndStart();
}

function startMistakesQuiz() {
    questions = shuffleArray(wrongQuestions);
    wrongQuestions = [];
    resetAndStart();
}

function resetAndStart() {
    currentIndex = 0;
    score = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('end-screen').style.display = 'none';
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    document.getElementById('part-title').innerText = q.part;
    document.getElementById('progress-text').innerText = `ข้อ ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const audioBtn = document.getElementById('audio-btn');
    const area = document.getElementById('interactive-area');

    feedback.style.display = 'none';
    checkBtn.style.display = 'block';
    nextBtn.style.display = 'none';
    selectedChoiceIndex = null;
    userSelectedSequence = [];
    hasScoredThisQuestion = false;
    hasFailedThisQuestion = false;
    area.innerHTML = '';

    if (q.type === 'listening') {
        audioBtn.style.display = 'inline-flex';
    } else {
        audioBtn.style.display = 'none';
    }

    if (q.type === 'choice' || q.type === 'listening') {
        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectChoiceOption(idx, btn);
            optsDiv.appendChild(btn);
        });
        area.appendChild(optsDiv);
    } else if (q.type === 'unscramble') {
        const answerZone = document.createElement('div');
        answerZone.className = 'answer-zone'; answerZone.id = 'answer-zone';
        
        const wordPool = document.createElement('div');
        wordPool.className = 'word-pool'; wordPool.id = 'word-pool';

        const shuffledWords = shuffleArray(q.words);
        shuffledWords.forEach((word) => {
            const chip = document.createElement('div');
            chip.className = 'word-chip'; chip.innerText = word;
            chip.onclick = () => toggleWordChip(chip, word);
            wordPool.appendChild(chip);
        });

        area.appendChild(answerZone); area.appendChild(wordPool);
    }
}

function resetCheckState() {
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('check-btn').style.display = 'block';
    document.getElementById('next-btn').style.display = 'none';
}

function selectChoiceOption(idx, btn) {
    playSound('click');
    resetCheckState();
    selectedChoiceIndex = idx;
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function toggleWordChip(chip, word) {
    playSound('click');
    resetCheckState();
    
    const answerZone = document.getElementById('answer-zone');
    const wordPool = document.getElementById('word-pool');

    if (chip.parentElement === wordPool) {
        speakJapaneseText(word);
        answerZone.appendChild(chip);
        userSelectedSequence.push(word);
    } else {
        wordPool.appendChild(chip);
        const index = userSelectedSequence.indexOf(word);
        if (index > -1) userSelectedSequence.splice(index, 1);
    }
}

function checkAnswer() {
    const q = questions[currentIndex];
    let isCorrect = false;

    if (q.type === 'choice' || q.type === 'listening') {
        if (selectedChoiceIndex === null) { alert('กรุณาเลือกคำตอบก่อนกดเช็คคำตอบครับ'); return; }
        isCorrect = (selectedChoiceIndex === q.ans);
    } else if (q.type === 'unscramble') {
        if (userSelectedSequence.length === 0) { alert('กรุณาเรียงประโยคก่อนกดเช็คคำตอบครับ'); return; }
        const userStr = userSelectedSequence.join('');
        const correctStr = q.correctSeq.join('');
        isCorrect = (userStr === correctStr);
    }

    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');

    if (isCorrect) {
        playSound('correct');
        setTimeout(() => { speakJapaneseText(q.ja); }, 350);
        if (!hasScoredThisQuestion && !hasFailedThisQuestion) { score++; hasScoredThisQuestion = true; }

        feedback.className = 'feedback correct';
        feedback.innerHTML = `✅ <b>ถูกต้อง!</b><br>🇯🇵 <b>คำตอบ:</b> ${q.ja}<br>🗣️ <b>เสียงอ่าน (Romaji):</b> ${q.romaji}<br>🇹🇭 <b>คำแปล:</b> ${q.th}`;
        checkBtn.style.display = 'none'; nextBtn.style.display = 'block';
    } else {
        playSound('wrong');
        if (!hasFailedThisQuestion) { wrongQuestions.push(q); hasFailedThisQuestion = true; }

        feedback.className = 'feedback wrong';
        feedback.innerHTML = `❌ <b>ยังไม่ถูกต้อง! ลองเปลี่ยนคำตอบใหม่อีกครั้งนะครับ</b>`;
    }
    feedback.style.display = 'block';
}

function nextQuestion() {
    playSound('click');
    currentIndex++;
    if (currentIndex < questions.length) showQuestion();
    else showEndScreen();
}

function showEndScreen() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    
    document.getElementById('final-score').innerText = score;
    document.getElementById('total-score').innerText = questions.length;
    
    const retryBtn = document.getElementById('retry-mistakes-btn');
    const wrongCountSpan = document.getElementById('wrong-count');
    
    if (wrongQuestions.length > 0) {
        wrongCountSpan.innerText = wrongQuestions.length;
        retryBtn.style.display = 'block';
    } else {
        retryBtn.style.display = 'none';
    }
}

window.onload = startQuiz;
</script>

</body>
</html>
