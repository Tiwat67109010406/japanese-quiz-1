<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Learning Quiz</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --correct: #22c55e;
      --incorrect: #ef4444;
      --tile-bg: #334155;
      --tile-selected: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 12px;
    }

    .progress {
      font-weight: bold;
      color: var(--accent);
    }

    .score {
      font-weight: bold;
      color: var(--correct);
    }

    .question-box {
      text-align: center;
      margin: 10px 0;
    }

    .question-text {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .audio-btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.2rem;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s, background-color 0.2s;
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

      background
